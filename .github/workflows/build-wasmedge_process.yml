---
name: build-wasmedge_process

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/build-wasmedge_process.yml'
      - '.github/scripts/wasmedge_process/**'
      - 'plugins/wasmedge_process/**'
      - 'test/plugins/wasmedge_process/**'
      - 'cmake/**'
      - 'CMakeLists.txt'

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]

    steps:
      - uses: actions/checkout@v7

      - name: Install WasmEdge
        run: |
          curl -sSf https://raw.githubusercontent.com/WasmEdge/WasmEdge/master/utils/install.sh | bash -s -- -v 0.17.2

      - name: Build and Test wasmedge_process
        run: |
          bash .github/scripts/wasmedge_process/build.sh
